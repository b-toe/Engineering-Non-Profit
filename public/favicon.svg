<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bridge icon representing structural engineering -->
  <rect width="64" height="64" rx="12" fill="#1D4ED8"/>
  <!-- Bridge towers -->
  <rect x="10" y="20" width="5" height="28" fill="white" rx="1"/>
  <rect x="49" y="20" width="5" height="28" fill="white" rx="1"/>
  <!-- Bridge deck -->
  <rect x="8" y="42" width="48" height="4" fill="white" rx="1"/>
  <!-- Suspension cables -->
  <path d="M12.5 22 Q32 30 51.5 22" stroke="#F97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Vertical hangers -->
  <line x1="22" y1="27.5" x2="22" y2="42" stroke="#F97316" stroke-width="1.5"/>
  <line x1="32" y1="30" x2="32" y2="42" stroke="#F97316" stroke-width="1.5"/>
  <line x1="42" y1="27.5" x2="42" y2="42" stroke="#F97316" stroke-width="1.5"/>
</svg>
